            exam: ['Examination Notices', 'Timetables, results and registrations'],
            events: ['Events & Activities', 'Upcoming events, academic calendar and activities'],
            placement: ['Placement & Internship', 'Campus drives, internships and preparation sessions'],
            important: ['Important Notices', 'High-priority and pinned notices that need attention'],
            saved: ['Saved Notices', 'Notices you have bookmarked'],
            profile: ['Profile', 'View and edit your details'],
            settings: ['Settings', 'Personalise your portal']
        };
        const SIMPLE_BROWSER_VIEWS = ['all', 'department', 'academic', 'important', 'saved', 'placement'];

        function Sidebar({ view, goTo, counts, open, onLogout }) {
            return (
                <aside className={`sidebar ${open ? 'open' : ''}`}>
                    <div className="sidebar-brand">
                        <div className="logo-symbol">N</div>
                        <div>
                            <span className="logo-text">NoticeHub</span>
                            <span className="inst-subtitle">ABESEC Ghaziabad</span>
                        </div>
                    </div>
                    <nav className="sidebar-nav">
                        {NAV_GROUPS.map(g => (
                            <div key={g.label}>
                                <div className="nav-label">{g.label}</div>
                                {g.items.map(it => (
                                    <button key={it.id} className={`nav-item ${view === it.id ? 'active' : ''}`} onClick={() => goTo(it.id)}>
                                        <Icon name={it.icon} size={18} />
                                        <span className="nav-text">{it.label}</span>
                                        {counts[it.id] > 0 && <span className={`nav-count ${it.id === 'all' ? '' : 'soft'}`}>{counts[it.id]}</span>}
                                    </button>
                                ))}
                            </div>
                        ))}
                    </nav>
                    <div className="sidebar-footer">
                        <button className="nav-item logout" onClick={onLogout}><Icon name="logout" size={18} /><span className="nav-text">Logout</span></button>
                    </div>
                </aside>
            );
        }

        /* =====================================================================
           NEW: Portal – the logged-in application shell
           ===================================================================== */
        function Portal({ user, selectedDept, setSelectedDept, onLogout, onUpdateUser }) {
            const [theme, setTheme] = useState(() => storage.get(STORAGE_KEYS.theme, 'light'));
            const [notices, setNotices] = useState(loadNotices);
            const [userData, setUserData] = useState(() => loadUserData(user.email));
            const [view, setView] = useState('dashboard');
            const [query, setQuery] = useState('');
            const [modalId, setModalId] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [notifOpen, setNotifOpen] = useState(false);
            const [confirm, setConfirm] = useState(null);
            const [toast, setToast] = useState(null);
            const toastTimer = useRef(null);
            const notifRef = useRef(null);
            const settings = userData.settings;

            /* Persistence */
            useEffect(() => { storage.set(STORAGE_KEYS.theme, theme); }, [theme]);
            useEffect(() => { storage.set(STORAGE_KEYS.notices, notices); }, [notices]);
            useEffect(() => { storage.set(STORAGE_KEYS.userData(user.email), userData); }, [userData]);

            /* Close notification panel on outside click; Esc closes the top-most layer */
            useEffect(() => {
                if (!notifOpen) return;
                const handler = (e) => { if (notifRef.current && !notifRef.current.contains(e.target)) setNotifOpen(false); };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [notifOpen]);
            useEffect(() => {
                const onKey = (e) => {
                    if (e.key !== 'Escape') return;
                    if (confirm) setConfirm(null);
                    else if (modalId) setModalId(null);
                    else if (notifOpen) setNotifOpen(false);
                    else if (sidebarOpen) setSidebarOpen(false);
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [confirm, modalId, notifOpen, sidebarOpen]);

            const showToast = (msg) => {
                setToast(msg);
                clearTimeout(toastTimer.current);
                toastTimer.current = setTimeout(() => setToast(null), 2400);
            };

            /* Notice visibility: own dept + common (ALL) + central cells, unless user opts into everything */
            const visible = useMemo(() => notices
                .filter(n => settings.showAllDepts || n.dept === user.department || n.dept === 'ALL' || CENTRAL_CELLS.includes(n.dept))
                .filter(n => !(settings.hideExpired && getStatus(n) === 'Expired')),
            [notices, user.department, settings.showAllDepts, settings.hideExpired]);

            /* Read / saved actions */
            const isRead = (id) => userData.read.includes(id);
            const isSaved = (id) => userData.saved.includes(id);
            const markRead = (id) => setUserData(u => u.read.includes(id) ? u : { ...u, read: [...u.read, id] });
            const toggleRead = (id) => setUserData(u => ({ ...u, read: u.read.includes(id) ? u.read.filter(x => x !== id) : [...u.read, id] }));
            const toggleSave = (id) => {
                const was = userData.saved.includes(id);
                setUserData(u => ({ ...u, saved: was ? u.saved.filter(x => x !== id) : [...u.saved, id] }));
                showToast(was ? 'Removed from saved notices' : 'Notice saved');
            };
            const openNotice = (id) => { setModalId(id); markRead(id); setNotifOpen(false); };
            const updateSetting = (key, value) => setUserData(u => ({ ...u, settings: { ...u.settings, [key]: value } }));

            const api = { isRead, isSaved, toggleRead, toggleSave, openNotice, compact: settings.compact, readIds: userData.read };

            /* Notifications = unread, not expired, and (new or high priority) */
            const notifications = useMemo(() => visible
                .filter(n => !userData.read.includes(n.id) && getStatus(n) !== 'Expired' && (isNew(n) || (settings.alertHigh && n.priority === 'High')))
                .sort(byNewest), [visible, userData.read, settings.alertHigh]);

            const stats = {
                total: visible.length,
                unread: visible.filter(n => !userData.read.includes(n.id)).length,
                events: getUpcomingEvents(visible).length,
                saved: notices.filter(n => userData.saved.includes(n.id)).length,
                read: visible.filter(n => userData.read.includes(n.id)).length
            };
            const counts = {
                all: stats.unread,
                saved: stats.saved,
                important: visible.filter(isImportantNotice).length
            };

            const calendarItems = useMemo(() => [
                ...ACADEMIC_CALENDAR,
                ...visible.filter(n => n.eventDate).map(n => ({ date: n.eventDate, title: n.title, type: 'event', noticeId: n.id })),
                ...visible.filter(n => n.deadline).map(n => ({ date: n.deadline, title: `Deadline: ${n.title}`, type: 'deadline', noticeId: n.id }))
            ], [visible]);

            /* Navigation */
            const goTo = (id) => { setView(id); setQuery(''); setSidebarOpen(false); setNotifOpen(false); window.scrollTo(0, 0); };
            const handleSearch = (val) => {
                setQuery(val);
                if (val.trim() && !SIMPLE_BROWSER_VIEWS.includes(view)) setView('all');
            };

            const requestLogout = () => setConfirm({
                title: 'Sign out of NoticeHub?',
                message: 'You will need to sign in again to view your notices. Your saved notices and settings are kept on this device.',
                confirmLabel: 'Yes, sign out',
                onConfirm: onLogout
            });
            const resetActivity = () => setConfirm({
                title: 'Reset read & saved notices?',
                message: 'All notices will be marked unread and your bookmarks will be cleared.',
                confirmLabel: 'Yes, reset',
                onConfirm: () => { setUserData(u => ({ ...u, read: [], saved: [] })); setConfirm(null); showToast('Read and saved notices reset'); }
            });
            const restoreNotices = () => setConfirm({
                title: 'Restore sample notices?',
                message: 'The demo notices are reloaded with fresh dates. Your read and saved lists are kept.',
                confirmLabel: 'Yes, restore',
                onConfirm: () => { setNotices(buildSeedNotices()); setConfirm(null); showToast('Sample notices restored'); }
            });

            const modalNotice = notices.find(n => n.id === modalId);
            const meta = VIEW_META[view];
            const dept = DEPARTMENTS.find(d => d.id === user.department) || DEPARTMENTS[0];

            const renderView = () => {
                const common = { api, query, setQuery };
                switch (view) {
                    case 'dashboard': return <DashboardView user={user} stats={stats} visible={visible} api={api} goTo={goTo} />;
                    case 'all': return <NoticeBrowser notices={visible} {...common} emptyTitle="No notices available" emptyText="There are no notices for your department yet." />;
                    case 'department': return <DepartmentView user={user} selectedDept={selectedDept} setSelectedDept={setSelectedDept} allNotices={notices} {...common} />;
                    case 'academic': return <NoticeBrowser notices={visible.filter(n => n.category === 'Academic')} {...common} lockCategory emptyIcon="book" emptyTitle="No academic updates" emptyText="Assignments, projects and syllabus changes will appear here." />;
                    case 'exam': return <ExamView notices={visible.filter(n => n.category === 'Examination')} {...common} showToast={showToast} />;
                    case 'events': return <EventsView allVisible={visible} eventNotices={visible.filter(n => n.category === 'Events')} calendarItems={calendarItems} {...common} />;
                    case 'placement': return <PlacementView notices={visible.filter(n => n.category === 'Placement')} {...common} />;
                    case 'important': return <NoticeBrowser notices={visible.filter(isImportantNotice)} {...common} emptyIcon="star" emptyTitle="No important notices" emptyText="High-priority and pinned notices will be highlighted here." />;
                    case 'saved': return <NoticeBrowser notices={notices.filter(n => userData.saved.includes(n.id))} {...common} emptyIcon="bookmark" emptyTitle="No saved notices yet" emptyText="Tap the bookmark icon on any notice to keep it here for later." />;
                    case 'profile': return <ProfileView user={user} stats={stats} onUpdateUser={onUpdateUser} showToast={showToast} />;
                    case 'settings': return <SettingsView theme={theme} setTheme={setTheme} settings={settings} updateSetting={updateSetting} onResetActivity={resetActivity} onRestoreNotices={restoreNotices} />;
                    default: return null;
                }
            };

            return (
                <div className="portal" data-theme={theme}>
                    <div className={`sidebar-overlay ${sidebarOpen ? 'open' : ''}`} onClick={() => setSidebarOpen(false)} />
                    <Sidebar view={view} goTo={goTo} counts={counts} open={sidebarOpen} onLogout={requestLogout} />

                    <div className="portal-main">
                        <header className="topbar">
                            <button className="icon-btn menu-btn" onClick={() => setSidebarOpen(true)} aria-label="Open menu"><Icon name="menu" size={20} /></button>
                            <div className="topbar-inst">
                                <Icon name="building" size={15} />
                                <span>ABESEC Ghaziabad</span>
                            </div>
                            <div className="search-box">
                                <span className="s-icon"><Icon name="search" size={16} /></span>
                                <input type="search" placeholder="Search notices by title or keyword…" value={query} onChange={(e) => handleSearch(e.target.value)} aria-label="Search notices" />
                                {query && <button className="s-clear" onClick={() => setQuery('')} aria-label="Clear search"><Icon name="x" size={14} /></button>}
                            </div>
                            <div className="topbar-spacer" />
                            <button className="icon-btn" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} title="Toggle dark / light mode" aria-label="Toggle theme">
                                <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={18} />
                            </button>
                            <div className="notif-wrap" ref={notifRef}>
                                <button className="icon-btn" onClick={() => setNotifOpen(o => !o)} aria-label="Notifications" title="Notifications">
                                    <Icon name="bell" size={18} />
                                    {notifications.length > 0 && <span className="bell-badge">{notifications.length > 9 ? '9+' : notifications.length}</span>}
                                </button>
                                {notifOpen && (
                                    <div className="notif-panel">
                                        <div className="notif-head">
                                            <h4>Notifications ({notifications.length})</h4>
                                            {notifications.length > 0 && (
                                                <button className="link-btn" onClick={() => { setUserData(u => ({ ...u, read: [...new Set([...u.read, ...notifications.map(n => n.id)])] })); showToast('All notifications marked as read'); }}>
                                                    Mark all read
                                                </button>
                                            )}
                                        </div>
                                        <div className="notif-list">
                                            {notifications.length ? notifications.slice(0, 8).map(n => (
                                                <div key={n.id} className="notif-item" onClick={() => openNotice(n.id)}>
                                                    <div className={`notif-ico ${n.priority === 'High' ? 'high' : ''}`}><Icon name={n.priority === 'High' ? 'alert' : 'bell'} size={16} /></div>
                                                    <div><h5>{n.title}</h5><span>{deptLabel(n.dept)} · {timeAgo(n.published)}</span></div>
                                                </div>
                                            )) : <EmptyState icon="check" title="You’re all caught up" text="No new notifications right now." />}
                                        </div>
                                    </div>
                                )}
                            </div>
                            <button className="avatar-chip" onClick={() => goTo('profile')} aria-label="Open profile">
                                <span className="avatar">{initials(user.name)}</span>
                                <span className="nm nm-wrap">{user.name.split(' ')[0]}<span className="dp">{dept.id} · {user.role || 'Student'}</span></span>
                            </button>
                        </header>

                        <main className="page" key={view}>
                            {view !== 'dashboard' && <PageHeader title={meta[0]} subtitle={meta[1]} />}
                            {renderView()}
                        </main>

                        <SiteFooter />
                    </div>

                    {modalNotice && <NoticeModal n={modalNotice} api={api} onClose={() => setModalId(null)} showToast={showToast} />}
                    {confirm && <ConfirmDialog title={confirm.title} message={confirm.message} confirmLabel={confirm.confirmLabel} onConfirm={confirm.onConfirm} onCancel={() => setConfirm(null)} />}
                    {toast && <div className="toast"><Icon name="check" size={15} /> {toast}</div>}
                </div>
            );
        }

        /* =====================================================================
           EXISTING: App (auth screen) – original states and handlers preserved,
           extended with real validation + localStorage accounts
           ===================================================================== */
        function App() {
            // NEW: restore a saved session (if any) so a refresh keeps the user logged in
            const [restoredUser] = useState(restoreSession);

            const [mode, setMode] = useState('login'); // 'login' or 'signup'
            const [selectedDept, setSelectedDept] = useState(restoredUser ? restoredUser.department : 'CSE');
            const [email, setEmail] = useState(restoredUser ? restoredUser.email : '');
            const [password, setPassword] = useState('');
            const [fullName, setFullName] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(!!restoredUser);

            // NEW state
            const [currentUser, setCurrentUser] = useState(restoredUser);
            const [rememberMe, setRememberMe] = useState(true);
            const [errors, setErrors] = useState({});

            const currentDept = DEPARTMENTS.find(d => d.id === selectedDept) || DEPARTMENTS[0];

            // Live count of active notices per department (replaces the static DEPARTMENTS.count on the chip label)
            const deptCounts = useMemo(() => {
                const list = storage.get(STORAGE_KEYS.notices, null) || buildSeedNotices();
                const c = {};
                list.forEach(n => { if (getStatus(n) !== 'Expired') c[n.dept] = (c[n.dept] || 0) + 1; });
                return c;
            }, []);
            const activeCount = deptCounts[selectedDept] != null ? deptCounts[selectedDept] : currentDept.count;

            // Portal uses a full-screen layout; the auth card keeps the original centered layout
            useEffect(() => {
                document.body.classList.toggle('portal-mode', isLoggedIn);
            }, [isLoggedIn]);

            const startSession = (user) => {
                saveSession(user.email, rememberMe);
                setCurrentUser(user);
                setSelectedDept(user.department);
                setEmail(user.email);
                setPassword('');
                setErrors({});
                setIsLoggedIn(true);
            };

            const validate = () => {
                const errs = {};
                const em = email.trim().toLowerCase();
                if (mode === 'signup') {
                    if (fullName.trim().length < 2) errs.fullName = 'Please enter your full name.';
                    else if (!/^[A-Za-z][A-Za-z .'-]+$/.test(fullName.trim())) errs.fullName = 'Name can only contain letters, spaces and . - \'';
                }
                if (!em) errs.email = 'Email address is required.';
                else if (!EMAIL_RE.test(em)) errs.email = 'Enter a valid email address.';
                if (!password) errs.password = 'Password is required.';
                else if (mode === 'signup') {
                    if (password.length < 6) errs.password = `Password is too short (${password.length}/6 characters). Use at least 6.`;
                }
                return errs;
            };

            const handleAuth = (e) => {
                e.preventDefault();
                const errs = validate();
                setErrors(errs);
                if (Object.keys(errs).length) return;

                const em = email.trim().toLowerCase();
                const users = ensureDefaultUsers();

                if (mode === 'signup') {
                    if (users.some(u => u.email === em)) {
                        setErrors({ email: 'An account with this email already exists. Please sign in instead.' });
                        return;
                    }
                    const newUser = {
                        id: 'u_' + Date.now(), name: fullName.trim(), email: em, password, role: 'Student',
                        department: selectedDept, year: '', phone: '', about: '', createdAt: new Date().toISOString()
                    };
                    storage.set(STORAGE_KEYS.users, [...users, newUser]);
                    startSession(newUser);
                } else {
                    const found = users.find(u => u.email === em);
                    if (!found) {
                        setErrors({ email: 'No account found for this email. Please sign up first.' });
                        return;
                    }
                    if (found.password !== password) {
                        setErrors({ password: 'Incorrect password. Please try again.' });
                        return;
                    }
                    startSession(found);
                }
            };

            const handleFastSSO = (provider) => {
                // Demo SSO: finds or creates a demo account so the user gets a real profile
                const em = `student@${provider.toLowerCase()}.edu`;
                const users = ensureDefaultUsers();
                let user = users.find(u => u.email === em);
                if (!user) {
                    user = {
                        id: 'u_' + Date.now(), name: `${provider} Demo Student`, email: em, password: 'password123', role: 'Student',
                        department: selectedDept, year: '', phone: '', about: '', createdAt: new Date().toISOString()
                    };
                    storage.set(STORAGE_KEYS.users, [...users, user]);
                }
                setEmail(em);
                setPassword('password123');
                startSession(user);
            };

            const handleLogout = () => {
                clearSession();
                setIsLoggedIn(false);
                setCurrentUser(null);
                setPassword('');
                setErrors({});
                setMode('login');
            };

            const handleUpdateUser = (updates) => {
                const updated = { ...currentUser, ...updates };
                const users = ensureDefaultUsers();
                storage.set(STORAGE_KEYS.users, users.map(u => (u.email === updated.email ? updated : u)));
                setCurrentUser(updated);
                if (updates.department) setSelectedDept(updates.department);
            };

            const switchMode = () => { setMode(mode === 'login' ? 'signup' : 'login'); setErrors({}); };

            const onEmailChange = (value) => {
                setEmail(value);
                if (errors.email || errors.password) setErrors({});
                if (mode === 'login') {
                    // Auto-select the registered department chip for a known account
                    const match = ensureDefaultUsers().find(u => u.email === value.trim().toLowerCase());
                    if (match) setSelectedDept(match.department);
                }
            };

            // Logged in -> full-screen portal (outside the auth card)
            if (isLoggedIn && currentUser) {
                return (
                    <Portal key={currentUser.email} user={currentUser} selectedDept={selectedDept} setSelectedDept={setSelectedDept}
                            onLogout={handleLogout} onUpdateUser={handleUpdateUser} />
                );
            }

            return (
                <div className="auth-shell">
                    <div className="auth-wrapper">
                        {/* LEFT SIDE: Clean Form Panel */}
                        <div className="auth-form-side">
                            <div>
                                <header className="brand-bar">
                                    <div className="brand-logo">
                                        <div className="logo-symbol">N</div>
                                        <div>
                                            <span className="logo-text">NoticeHub</span>
                                            <span className="inst-subtitle">ABESEC Ghaziabad</span>
                                        </div>
                                    </div>
                                    <div className="live-tag">
                                        <span className="live-dot"></span>
                                        <span>Campus Live</span>
                                    </div>
                                </header>

                                <div className="form-heading-area">
                                    <h1>{mode === 'login' ? 'Welcome Back' : 'Create Account'}</h1>
                                    <p>
                                        {mode === 'login' 
                                            ? 'Enter your institutional credentials to view circulars.'
                                            : 'Register to access departmental announcements in real time.'}
                                    </p>
                                </div>

                                {/* Direct Fast SSO */}
                                <div className="sso-buttons">
                                    <button 
                                        type="button" 
                                        className="sso-btn"
                                        onClick={() => handleFastSSO('Google')}
                                    >
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                                        </svg>
                                        Google SSO
                                    </button>
                                    <button 
                                        type="button" 
                                        className="sso-btn"
                                        onClick={() => handleFastSSO('Portal')}
                                    >
                                        <IconBuilding size={17} color="#2563eb" />
                                        College Portal
                                    </button>
                                </div>

                                <div className="divider">
                                    <span>or continue with email</span>
                                </div>

                                {/* Department Chips with Inline SVG */}
                                <div className="field-label-row">
                                    <span className="field-label">Select Department</span>
                                    <span style={{ fontSize: '0.78rem', color: '#2563eb', fontWeight: '700' }}>
                                        {activeCount} circulars active
                                    </span>
                                </div>
                                <div className="dept-chips-container">
                                    {DEPARTMENTS.map(d => {
                                        const DeptIcon = d.Icon;
                                        const isActive = selectedDept === d.id;
                                        return (
                                            <button
                                                key={d.id}
                                                type="button"
                                                className={`dept-badge-btn ${isActive ? 'active' : ''}`}
                                                onClick={() => setSelectedDept(d.id)}
                                            >
                                                <DeptIcon size={14} color={isActive ? "#ffffff" : "#475569"} />
                                                {d.id}
                                            </button>
                                        );
                                    })}
                                </div>

                                <form onSubmit={handleAuth} noValidate>
                                    {errors.form && (
                                        <div className="auth-alert"><Icon name="alert" size={16} />{errors.form}</div>
                                    )}

                                    {mode === 'signup' && (
                                        <div className="form-row">
                                            <div className="field-label-row">
                                                <span className="field-label">Full Name</span>
                                            </div>
                                            <div className="input-box">
                                                <span className="input-icon">
                                                    <IconUser size={17} color="#94a3b8" />
                                                </span>
                                                <input 
                                                    type="text" 
                                                    placeholder="Ayush Shukla" 
                                                    className={errors.fullName ? 'has-error' : ''}
                                                    value={fullName}
                                                    onChange={(e) => { setFullName(e.target.value); if (errors.fullName) setErrors({ ...errors, fullName: undefined }); }}
                                                    required 
                                                />
                                            </div>
                                            {errors.fullName && <div className="field-error">{errors.fullName}</div>}
                                        </div>
                                    )}

                                    <div className="form-row">
                                        <div className="field-label-row">
                                            <span className="field-label">Email Address</span>
                                        </div>
                                        <div className="input-box">
                                            <span className="input-icon">
                                                <IconMail size={17} color="#94a3b8" />
                                            </span>
                                            <input 
                                                type="email" 
                                                placeholder="student@abesec.ac.in" 
                                                className={errors.email ? 'has-error' : ''}
                                                value={email}
                                                onChange={(e) => onEmailChange(e.target.value)}
                                                required 
                                            />
                                        </div>
                                        {errors.email && <div className="field-error">{errors.email}</div>}
                                    </div>

                                    <div className="form-row">
                                        <div className="field-label-row">
                                            <span className="field-label">Password</span>
                                        </div>
                                        <div className="input-box">
                                            <span className="input-icon">
                                                <IconLock size={17} color="#94a3b8" />
                                            </span>
                                            <input 
                                                type={showPassword ? 'text' : 'password'} 
                                                placeholder="••••••••" 
                                                className={errors.password ? 'has-error' : ''}
                                                value={password}
                                                onChange={(e) => { setPassword(e.target.value); if (errors.password) setErrors({ ...errors, password: undefined }); }}
                                                required 
                                            />
                                            <button 
                                                type="button" 
                                                className="show-pass-btn"
                                                onClick={() => setShowPassword(!showPassword)}
                                            >
                                                {showPassword ? 'Hide' : 'Show'}
                                            </button>
                                        </div>
                                        {errors.password && <div className="field-error">{errors.password}</div>}
                                        {mode === 'signup' && !errors.password && <div className="field-hint">Minimum 6 characters.</div>}
                                    </div>

                                    {mode === 'login' && (
                                        <div className="row-options">
                                            <label>
                                                <input type="checkbox" checked={rememberMe} onChange={(e) => setRememberMe(e.target.checked)} /> Remember me
                                            </label>
                                            <a href="#" onClick={(e) => { e.preventDefault(); alert('Password recovery link sent to your college email.'); }}>
                                                Forgot password?
                                            </a>
                                        </div>
                                    )}

                                    <button type="submit" className="btn-submit-main" style={mode === 'signup' ? { marginTop: '22px' } : undefined}>
                                        <span>{mode === 'login' ? `Enter ${selectedDept} Portal` : 'Create Account'}</span>
                                        <span>→</span>
                                    </button>
                                </form>
                            </div>

                            <div className="form-bottom-link">
                                {mode === 'login' ? "Don't have an account yet?" : "Already have an account?"}
                                <button type="button" onClick={switchMode}>
                                    {mode === 'login' ? 'Sign up' : 'Sign in'}
                                </button>
                            </div>
                        </div>

                        {/* RIGHT SIDE: Clean Showcase Hero Panel */}
                        <div className="auth-showcase-side">
                            <div className="showcase-circle-1"></div>
                            <div className="showcase-circle-2"></div>

                            <div className="hero-top">
                                <div className="hero-badge-pill">
                                    <IconZap size={13} color="#ffffff" />
                                    <span>ABESEC Ghaziabad · Live Campus Network</span>
                                </div>
                                <h2>Department-Wise<br/>Digital Notice Board</h2>
                                <p>
                                    Direct access to verified circulars, exam schedules, and placement updates across all campus branches.
                                </p>
                            </div>

                            {/* Clean Feature Highlights with SVGs */}
                            <div className="features-clean-panel">
                                <div className="feature-item">
                                    <div className="feature-icon-box">
                                        <IconBuilding size={20} color="#ffffff" />
                                    </div>
                                    <div className="feature-text">
                                        <h4>Department Categorization</h4>
                                        <p>Filter announcements by branch (CSE, IT, ECE, ME, T&amp;P, EXAM) instantly.</p>
                                    </div>
                                </div>

                                <div className="feature-item">
                                    <div className="feature-icon-box">
                                        <IconZap size={20} color="#ffffff" />
                                    </div>
                                    <div className="feature-text">
                                        <h4>Real-Time Announcements</h4>
                                        <p>Direct updates from Dean, Examination Cell, and Training &amp; Placement.</p>
                                    </div>
                                </div>

                                <div className="feature-item">
                                    <div className="feature-icon-box">
                                        <IconDevice size={20} color="#ffffff" />
                                    </div>
                                    <div className="feature-text">
                                        <h4>Zero Paper Wastage</h4>
                                        <p>Eco-friendly, digital-first communication across all smart displays.</p>
                                    </div>
                                </div>
                            </div>

                            {/* Bottom Social Proof */}
                            <div className="showcase-footer">
                                <div className="student-avatars">
                                    <div className="avatar-circle">AS</div>
                                    <div className="avatar-circle">RB</div>
                                    <div className="avatar-circle">PS</div>
                                    <div className="avatar-circle">+7</div>
                                </div>
                                <div className="avatar-info-text">
                                    <strong>2,400+ Active</strong><br/>
                                    Students &amp; Faculty Connected
                                </div>
                            </div>
                        </div>
                    </div>

                    <SiteFooter />
                </div>
            );
        }

        const container = document.getElementById('root');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>
</html>
